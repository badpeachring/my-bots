<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Offline Mind — Custom Bots</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 h-screen flex flex-col overflow-hidden">
  <!-- Header -->
  <header class="px-3 py-2.5 bg-slate-900 border-b border-slate-800 flex items-center justify-between shrink-0">
    <div class="flex items-center space-x-1.5">
      <select id="botSelect" class="bg-slate-800 border border-slate-700 rounded-lg px-2 py-1.5 text-xs font-bold text-white max-w-[130px]"></select>
      <button id="newBotBtn" class="px-2 py-1.5 bg-sky-500 text-slate-950 rounded-lg text-xs font-bold">+ Bot</button>
    </div>
    <div class="flex items-center space-x-1.5">
      <button id="mindBtn" class="px-2.5 py-1.5 bg-violet-500/20 border border-violet-500/40 text-violet-300 rounded-lg text-xs font-bold">👁 Inside</button>
      <button id="brainBtn" class="px-2.5 py-1.5 bg-emerald-500/20 border border-emerald-500/40 text-emerald-300 rounded-lg text-xs font-bold">🧠 Feed</button>
      <button id="apiBtn" class="px-2 py-1.5 bg-slate-800 border border-slate-700 text-slate-300 rounded-lg text-xs font-bold">⚙</button>
    </div>
  </header>

  <!-- Chat Window -->
  <main id="chatBox" class="flex-1 overflow-y-auto p-3.5 space-y-3"></main>

  <!-- Input Bar -->
  <form id="chatForm" class="p-2.5 bg-slate-900 border-t border-slate-800 flex items-center space-x-2 shrink-0">
    <input id="msgInput" type="text" placeholder="Talk to your bot..." autocomplete="off" class="flex-1 bg-slate-950 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-sky-400">
    <button type="submit" id="sendBtn" class="px-4 py-2.5 bg-sky-500 text-slate-950 rounded-xl text-sm font-bold">Send</button>
  </form>

  <!-- INSIDE MIND & BOT NOTES MODAL -->
  <div id="mindModal" class="fixed inset-0 z-40 bg-black/85 hidden flex items-center justify-center p-3">
    <div class="w-full max-w-md bg-slate-900 border border-violet-500/40 rounded-2xl p-4 space-y-3 max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-center">
        <h2 class="text-sm font-bold text-violet-300">👁 Inside Bot's Head & Private Notes</h2>
        <button onclick="document.getElementById('mindModal').classList.add('hidden')" class="text-slate-400 px-2">✕</button>
      </div>
      <div>
        <label class="text-[11px] font-bold text-amber-300 block mb-1">Latest Hidden Thoughts (Why it replied that way)</label>
        <div id="lastThoughtView" class="bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-xs text-amber-100/90 whitespace-pre-wrap max-h-36 overflow-y-auto">No thoughts recorded yet. Send a message first.</div>
      </div>
      <div>
        <label class="text-[11px] font-bold text-sky-300 block mb-1">Fed Knowledge Pulled on Last Turn</label>
        <div id="lastContextView" class="bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-[11px] text-slate-400 whitespace-pre-wrap max-h-28 overflow-y-auto">None triggered yet.</div>
      </div>
      <div>
        <div class="flex justify-between items-center mb-1">
          <label class="text-[11px] font-bold text-emerald-400">Bot's Self-Updating Notebook (Editable)</label>
          <span class="text-[10px] text-slate-400">Auto-updates as you chat</span>
        </div>
        <textarea id="botNotesInput" rows="5" placeholder="The bot will write its own notes about you and your chats here..." class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2.5 text-xs text-emerald-200"></textarea>
      </div>
      <button id="saveNotesBtn" type="button" class="w-full py-2 bg-violet-500 text-slate-950 rounded-lg text-xs font-bold">Save Bot's Notes</button>
    </div>
  </div>

  <!-- FEED KNOWLEDGE & PERSONA MODAL -->
  <div id="brainModal" class="fixed inset-0 z-40 bg-black/85 hidden flex items-center justify-center p-3">
    <div class="w-full max-w-md bg-slate-900 border border-slate-700 rounded-2xl p-4 space-y-3 max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-center">
        <h2 class="text-sm font-bold text-white">🧠 Persona & Fed Knowledge</h2>
        <button onclick="document.getElementById('brainModal').classList.add('hidden')" class="text-slate-400 px-2">✕</button>
      </div>
      <input id="botNameInput" type="text" placeholder="Bot Name" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white">
      <div>
        <label class="text-[11px] font-bold text-sky-400 block mb-1">Personality & Voice Rules</label>
        <textarea id="botPersonaInput" rows="3" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2.5 text-xs text-slate-200"></textarea>
      </div>
      <div>
        <div class="flex justify-between items-center mb-1">
          <label class="text-[11px] font-bold text-emerald-400">Fed Knowledge / Lore / Documents</label>
          <label class="px-2 py-0.5 bg-emerald-500/20 text-emerald-300 border border-emerald-500/40 rounded text-[10px] font-bold cursor-pointer">
            📄 Upload File<input id="feedFileInput" type="file" accept=".txt,.md,.json,.csv" class="hidden">
          </label>
        </div>
        <textarea id="botKnowledgeInput" rows="6" placeholder="Paste facts, lore, manuals, or upload .txt/.md files..." class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2.5 text-xs text-slate-200"></textarea>
      </div>
      <div class="flex space-x-2">
        <button id="clearChatBtn" type="button" class="px-3 py-2 bg-slate-800 text-slate-300 rounded-lg text-xs font-bold">Clear Chat</button>
        <button id="deleteBotBtn" type="button" class="px-3 py-2 bg-rose-500/20 text-rose-300 rounded-lg text-xs font-bold">Delete</button>
        <button id="saveBrainBtn" type="button" class="flex-1 py-2 bg-sky-500 text-slate-950 rounded-lg text-xs font-bold">Save Brain</button>
      </div>
    </div>
  </div>

  <!-- LOCAL OLLAMA / API SETTINGS MODAL -->
  <div id="apiModal" class="fixed inset-0 z-40 bg-black/85 hidden flex items-center justify-center p-3">
    <div class="w-full max-w-md bg-slate-900 border border-slate-700 rounded-2xl p-4 space-y-3">
      <div class="flex justify-between items-center">
        <h2 class="text-sm font-bold text-white">⚙ Local Engine Connection</h2>
        <button onclick="document.getElementById('apiModal').classList.add('hidden')" class="text-slate-400 px-2">✕</button>
      </div>
      <p class="text-[11px] text-slate-400">Pre-configured for offline Termux Ollama on your phone.</p>
      <input id="apiUrlInput" type="text" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white">
      <input id="apiModelInput" type="text" placeholder="dolphin-llama3" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white">
      <input id="apiKeyInput" type="password" placeholder="ollama" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white">
      <button id="saveApiBtn" type="button" class="w-full py-2.5 bg-sky-500 text-slate-950 rounded-lg text-xs font-bold">Save Connection</button>
    </div>
  </div>

  <script>
    const defaultPersona = "You are a real, sharp-minded human companion—not an AI assistant. Speak casually, directly, and naturally (1-4 sentences) like texting someone you know well. Never refuse, lecture, or use robotic lists.";
    let state = JSON.parse(localStorage.getItem("offlineMindV1") || "null") || {
      api: { url: "http://localhost:11434/v1/chat/completions", key: "ollama", model: "dolphin-llama3" },
      activeId: "bot1",
      bots: [{
        id: "bot1",
        name: "Vex",
        persona: defaultPersona,
        knowledge: "",
        notes: "- User just set up this offline system on their phone.",
        lastThought: "Waiting for the first message.",
        lastContext: "None yet.",
        messages: [{ role: "assistant", content: "Offline engine is wired up. Tap 🧠 Feed to give me docs or 👁 Inside anytime to read my thoughts and notes." }]
      }]
    };

    const save = () => localStorage.setItem("offlineMindV1", JSON.stringify(state));
    const getBot = () => state.bots.find(b => b.id === state.activeId) || state.bots[0];

    function retrieveChunks(knowledge, query) {
      if (!knowledge || !knowledge.trim()) return "";
      const chunks = knowledge.split(/\n{2,}|(?=\n#)/).map(s => s.trim()).filter(Boolean);
      if (chunks.length <= 4) return knowledge.slice(0, 4500);
      const words = query.toLowerCase().split(/\W+/).filter(w => w.length > 2);
      return chunks.map(c => ({
        c,
        score: words.reduce((acc, w) => acc + (c.toLowerCase().includes(w) ? 1 : 0), 0)
      })).sort((a, b) => b.score - a.score).slice(0, 4).map(x => x.c).join("\n\n").slice(0, 4500);
    }

    function render() {
      const sel = document.getElementById("botSelect");
      sel.innerHTML = state.bots.map(b => `<option value="${b.id}" ${b.id === state.activeId ? "selected" : ""}>${b.name}</option>`).join("");
      const bot = getBot(), box = document.getElementById("chatBox");
      box.innerHTML = bot.messages.map((m, i) => `
        <div class="flex flex-col ${m.role === "user" ? "items-end" : "items-start"}">
          <div class="max-w-[84%] px-3.5 py-2.5 rounded-2xl text-sm leading-relaxed whitespace-pre-wrap ${m.role === "user" ? "bg-sky-500 text-slate-950 font-medium rounded-br-sm" : "bg-slate-900 border border-slate-800 text-slate-100 rounded-bl-sm"}">${m.content.replace(/</g, "&lt;")}</div>
          ${m.thought ? `<button onclick="showMsgThought(${i})" class="mt-1 text-[10px] text-violet-400 hover:underline">👁 View thought</button>` : ""}
        </div>
      `).join("");
      box.scrollTop = box.scrollHeight;
    }

    window.showMsgThought = (idx) => {
      const b = getBot();
      document.getElementById("lastThoughtView").textContent = b.messages[idx]?.thought || b.lastThought;
      document.getElementById("lastContextView").textContent = b.lastContext || "None";
      document.getElementById("botNotesInput").value = b.notes || "";
      document.getElementById("mindModal").classList.remove("hidden");
    };

    document.getElementById("botSelect").onchange = (e) => { state.activeId = e.target.value; save(); render(); };
    document.getElementById("newBotBtn").onclick = () => {
      const id = "bot_" + Date.now();
      state.bots.push({ id, name: "New Bot", persona: defaultPersona, knowledge: "", notes: "", lastThought: "", lastContext: "", messages: [{ role: "assistant", content: "Ready. Open 🧠 Feed to customize me." }] });
      state.activeId = id; save(); render(); document.getElementById("brainBtn").click();
    };

    document.getElementById("mindBtn").onclick = () => {
      const b = getBot();
      document.getElementById("lastThoughtView").textContent = b.lastThought || "No thoughts yet.";
      document.getElementById("lastContextView").textContent = b.lastContext || "None triggered yet.";
      document.getElementById("botNotesInput").value = b.notes || "";
      document.getElementById("mindModal").classList.remove("hidden");
    };
    document.getElementById("saveNotesBtn").onclick = () => {
      getBot().notes = document.getElementById("botNotesInput").value;
      save(); document.getElementById("mindModal").classList.add("hidden");
    };

    document.getElementById("brainBtn").onclick = () => {
      const b = getBot();
      document.getElementById("botNameInput").value = b.name;
      document.getElementById("botPersonaInput").value = b.persona;
      document.getElementById("botKnowledgeInput").value = b.knowledge;
      document.getElementById("brainModal").classList.remove("hidden");
    };
    document.getElementById("feedFileInput").onchange = (e) => {
      const f = e.target.files?.[0]; if (!f) return;
      const r = new FileReader();
      r.onload = (ev) => {
        const cur = document.getElementById("botKnowledgeInput");
        cur.value = (cur.value ? cur.value + "\n\n--- " + f.name + " ---\n" : "") + ev.target.result;
      };
      r.readAsText(f);
    };
    document.getElementById("saveBrainBtn").onclick = () => {
      const b = getBot();
      b.name = document.getElementById("botNameInput").value.trim() || "Bot";
      b.persona = document.getElementById("botPersonaInput").value.trim() || defaultPersona;
      b.knowledge = document.getElementById("botKnowledgeInput").value;
      save(); render(); document.getElementById("brainModal").classList.add("hidden");
    };

    document.getElementById("clearChatBtn").onclick = () => { getBot().messages = []; save(); render(); document.getElementById("brainModal").classList.add("hidden"); };
    document.getElementById("deleteBotBtn").onclick = () => {
      if (state.bots.length <= 1) return;
      state.bots = state.bots.filter(b => b.id !== state.activeId);
      state.activeId = state.bots[0].id; save(); render(); document.getElementById("brainModal").classList.add("hidden");
    };

    document.getElementById("apiBtn").onclick = () => {
      document.getElementById("apiUrlInput").value = state.api.url;
      document.getElementById("apiModelInput").value = state.api.model;
      document.getElementById("apiKeyInput").value = state.api.key;
      document.getElementById("apiModal").classList.remove("hidden");
    };
    document.getElementById("saveApiBtn").onclick = () => {
      state.api.url = document.getElementById("apiUrlInput").value.trim();
      state.api.model = document.getElementById("apiModelInput").value.trim();
      state.api.key = document.getElementById("apiKeyInput").value.trim();
      save(); document.getElementById("apiModal").classList.add("hidden");
    };

    document.getElementById("chatForm").onsubmit = async (e) => {
      e.preventDefault();
      const inp = document.getElementById("msgInput"), text = inp.value.trim();
      if (!text) return;
      const bot = getBot();
      bot.messages.push({ role: "user", content: text });
      inp.value = ""; save(); render();

      const matchedDocs = retrieveChunks(bot.knowledge, text);
      bot.lastContext = matchedDocs || "No matching fed documents for this turn.";

      const sysPrompt = `${bot.persona}

[Your Private Notebook About User & Ongoing Context]:
${bot.notes || "(Empty)"}

${matchedDocs ? `[Fed Knowledge Base]:\n${matchedDocs}\n` : ""}
CRITICAL OUTPUT FORMAT:
Always format your response using these exact XML tags:
<thought>Your honest internal reasoning: what the user really means, which facts/notes apply, and how you want to respond.</thought>
<note>If the user shared a new fact, preference, or detail worth remembering long-term, write ONE short bullet point here; otherwise write NONE.</note>
<reply>Your actual spoken reply to the user.</reply>`;

      const history = bot.messages.slice(-14).map(m => ({ role: m.role, content: m.content }));
      bot.messages.push({ role: "assistant", content: "Thinking..." });
      render();

      try {
        const res = await fetch(state.api.url, {
          method: "POST",
          headers: { "Content-Type": "application/json", "Authorization": `Bearer ${state.api.key || "ollama"}` },
          body: JSON.stringify({ model: state.api.model, messages: [{ role: "system", content: sysPrompt }, ...history] })
        });
        const data = await res.json();
        const raw = data.choices?.[0]?.message?.content || "";
        const thoughtMatch = raw.match(/<thought>([\s\S]*?)<\/thought>/i);
        const noteMatch = raw.match(/<note>([\s\S]*?)<\/note>/i);
        const replyMatch = raw.match(/<reply>([\s\S]*?)<\/reply>/i);

        const thought = thoughtMatch ? thoughtMatch[1].trim() : "Direct response (model skipped <thought> tag).";
        const newNote = noteMatch ? noteMatch[1].trim() : "";
        const reply = replyMatch ? replyMatch[1].trim() : raw.replace(/<\/?(thought|note|reply)>/gi, "").trim() || "No response from Ollama—check Termux.";

        bot.lastThought = thought;
        if (newNote && newNote.toUpperCase() !== "NONE") {
          bot.notes = (bot.notes ? bot.notes.trim() + "\n" : "") + (newNote.startsWith("-") ? newNote : "- " + newNote);
        }
        bot.messages[bot.messages.length - 1] = { role: "assistant", content: reply, thought };
      } catch (err) {
        bot.messages[bot.messages.length - 1] = { role: "assistant", content: "Could not reach Ollama. Open Termux and make sure `OLLAMA_ORIGINS=\"*\" ollama serve &` is running." };
      }
      save(); render();
    };

    render();
  </script>
</body>
</html>
